name: Deploy to MonsterASP.NET

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  API_CSPROJ_PATH: MovieReservationSystem.Backend.csproj
  PUBLISH_OUTPUT_DIR: publish

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine .NET SDK version from csproj
        id: dotnet-version
        shell: pwsh
        run: |
          $csprojContent = Get-Content -Path $env:API_CSPROJ_PATH -Raw
          if ($csprojContent -notmatch '<TargetFramework>net(?<version>\d+\.\d+)</TargetFramework>') {
            throw "Could not find <TargetFramework> in $env:API_CSPROJ_PATH"
          }
          $sdkVersion = "$($Matches.version).x"
          Write-Host "Detected .NET SDK version: $sdkVersion"
          "version=$sdkVersion" >> $env:GITHUB_OUTPUT

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.dotnet-version.outputs.version }}

      - name: Restore dependencies
        run: dotnet restore "${{ env.API_CSPROJ_PATH }}"

      - name: Publish
        run: >
          dotnet publish "${{ env.API_CSPROJ_PATH }}"
          -c Release
          -o "${{ github.workspace }}\${{ env.PUBLISH_OUTPUT_DIR }}"
          --runtime win-x86
          --self-contained false

      - name: Deploy to MonsterASP.NET via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: ${{ env.PUBLISH_OUTPUT_DIR }}
